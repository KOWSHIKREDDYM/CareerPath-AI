<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareerPath AI - Student Profile</title>

    <link rel="stylesheet" href="/static/style.css">

    <style>
        .profile-page {
            min-height: calc(100vh - 72px);
            padding: 60px 8%;
            background: #f7f9fc;
        }

        .profile-container {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(30, 60, 120, 0.08);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .profile-header h1 {
            font-size: 36px;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .profile-header p {
            color: #667085;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 13px 15px;
            border: 1px solid #d9dfeb;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #2563eb;
        }

        .form-group textarea {
            min-height: 110px;
            resize: vertical;
        }

        .continue-button {
            width: 100%;
            margin-top: 30px;
            background: #2563eb;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .continue-button:hover {
            background: #1d4ed8;
        }

        .required {
            color: #dc2626;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .profile-container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">CareerPath AI</div>

        <nav>
            <a href="/">Home</a>
        </nav>
    </header>


    <main class="profile-page">

        <div class="profile-container">

            <div class="profile-header">

                <div class="badge">
                    Step 1 of 3
                </div>

                <h1>Create Your Career Profile</h1>

                <p>
                    Tell us about yourself so CareerPath AI can
                    personalize your career roadmap.
                </p>

            </div>


            <form id="profileForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label>
                            Full Name <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="example@email.com"
                        >
                    </div>


                    <div class="form-group">

                        <label>
                            Branch <span class="required">*</span>
                        </label>

                        <select id="branch" required>

                            <option value="">
                                Select your branch
                            </option>

                            <option value="CSE">
                                Computer Science & Engineering
                            </option>

                            <option value="IT">
                                Information Technology
                            </option>

                            <option value="ECE">
                                Electronics & Communication
                            </option>

                            <option value="EEE">
                                Electrical & Electronics
                            </option>

                            <option value="Mechanical">
                                Mechanical Engineering
                            </option>

                            <option value="Civil">
                                Civil Engineering
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Year <span class="required">*</span>
                        </label>

                        <select id="year" required>

                            <option value="">
                                Select year
                            </option>

                            <option value="1">
                                1st Year
                            </option>

                            <option value="2">
                                2nd Year
                            </option>

                            <option value="3">
                                3rd Year
                            </option>

                            <option value="4">
                                4th Year
                            </option>

                        </select>

                    </div>


                    <div class="form-group full">

                        <label>
                            Current Skills
                        </label>

                        <textarea
                            id="skills"
                            placeholder="Example: Python, C, SQL, HTML, CSS, Git"
                        ></textarea>

                    </div>


                    <div class="form-group full">

                        <label>
                            Target Career <span class="required">*</span>
                        </label>

                        <select id="career" required>

                            <option value="">
                                Select your target career
                            </option>

                            <option value="Software Developer">
                                Software Developer
                            </option>

                            <option value="Data Scientist">
                                Data Scientist
                            </option>

                            <option value="Machine Learning Engineer">
                                Machine Learning Engineer
                            </option>

                            <option value="Data Analyst">
                                Data Analyst
                            </option>

                            <option value="Full-Stack Developer">
                                Full-Stack Developer
                            </option>

                        </select>

                    </div>

                </div>


                <button
                    type="submit"
                    class="continue-button"
                >
                    Continue to Resume Analysis →
                </button>

            </form>

        </div>

    </main>

<script src="/static/auth.js"></script>

    <script>

       const loggedInUser = requireLogin();

       if (!loggedInUser) {
           throw new Error("User is not logged in.");
      }
        document
            .getElementById("profileForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const profile = {

                    name:
                        document.getElementById("name").value,

                    email:
                        document.getElementById("email").value,

                    branch:
                        document.getElementById("branch").value,

                    year:
                        document.getElementById("year").value,

                    skills:
                        document.getElementById("skills").value,

                    career:
                        document.getElementById("career").value

                };


                localStorage.setItem(
                    "careerPathProfile",
                    JSON.stringify(profile)
                );


                window.location.href =
                    "/static/resume.html";

            });

    </script>

</body>

</html>
